{{/* ── [PCODE-214 | S15 | v0.1.0] T19.3 Several server nodes (events, presence and migrations across nodes) and a Helm chart ── */}}
{{- if not .Values.secrets.existingSecret }}
{{- if or (not .Values.secrets.databaseUrl) (not .Values.secrets.secretKey) }}
{{- fail "Set secrets.databaseUrl and secrets.secretKey, or secrets.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orqiva.name" . }}
  labels: {{- include "orqiva.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  ORQIVA_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
{{- end }}
